; WITU AI CMS — PHP-FPM pool (php8.4-fpm). Installed to /etc/php/8.4/fpm/pool.d/witu-cms.conf
; Sized for 2 vCPU / 4 GB shared with Ollama (~1.5 GB for qwen2.5:1.5b), MariaDB and the gateway.
; Each worker is ~40-70 MB; 6 workers cap the CMS at ~400 MB. Admin traffic is low, so
; "ondemand" keeps zero idle workers between page loads.
[witu-cms]
user = witu-cms
group = witu-cms
listen = /run/php/witu-cms.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 30s
pm.max_requests = 500

; Long gateway calls are capped at 15 s in the client; 60 s is a hard stop for anything else.
request_terminate_timeout = 60s
request_slowlog_timeout = 10s
slowlog = /var/log/witu-ai/cms-fpm-slow.log

; Do not leak server env into PHP; Laravel reads its own .env.
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /var/log/witu-ai/cms-php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 256M
php_admin_value[upload_max_filesize] = 4M
php_admin_value[post_max_size] = 8M
php_admin_value[max_execution_time] = 60
php_admin_value[session.cookie_secure] = 1
php_admin_value[session.cookie_httponly] = 1
php_admin_value[expose_php] = 0
