; WITU AI — OPcache for php8.4-fpm (/etc/php/8.4/fpm/conf.d/99-witu.ini)
; validate_timestamps=0: code changes only take effect after `systemctl reload php8.4-fpm`,
; which infra/witu/deploy-cms.sh does on every deploy and rollback.
opcache.enable=1
opcache.memory_consumption=96
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=disable
realpath_cache_size=4096K
realpath_cache_ttl=600
expose_php=0
