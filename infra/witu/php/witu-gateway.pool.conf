; WITU AI gateway v2 (phase B): PHP-FPM pool. Installed to /etc/php/8.4/fpm/pool.d/witu-gateway.conf.
; Only the CMS calls it (management surface on 127.0.0.1:8081), so traffic is tiny: "ondemand"
; keeps no idle workers. Inference does not run here; the systemd worker does it.
[witu-gateway]
user = witu-gw
group = witu-gw
listen = /run/php/witu-gateway.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 3
pm.process_idle_timeout = 30s
pm.max_requests = 500

request_terminate_timeout = 30s
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /opt/witu-gateway/storage/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 128M
php_admin_value[post_max_size] = 64K
php_admin_value[upload_max_filesize] = 0
php_admin_flag[file_uploads] = off
php_admin_value[expose_php] = 0
