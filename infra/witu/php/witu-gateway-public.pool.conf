; WITU AI gateway v2, PUBLIC surface (phase C): apps' /gw/v1 requests. Installed to
; /etc/php/8.4/fpm/pool.d/witu-gateway-public.conf by install-gateway.sh.
; /v1/chat/completions waits for the single inference worker (sync_wait_seconds, default 85 s),
; so each waiting request holds one PHP process: max_children covers a full queue (8) plus
; quick calls (/v1/models, /v1/jobs). Waiting processes sleep and use little CPU.
[witu-gateway-public]
user = witu-gw
group = witu-gw
listen = /run/php/witu-gateway-public.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 12
pm.process_idle_timeout = 30s
pm.max_requests = 500

request_terminate_timeout = 180s
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /opt/witu-gateway/storage/logs/php-error.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
php_admin_value[memory_limit] = 96M
php_admin_value[max_execution_time] = 175
php_admin_value[post_max_size] = 128K
php_admin_value[upload_max_filesize] = 0
php_admin_flag[file_uploads] = off
php_admin_value[expose_php] = 0
php_admin_value[disable_functions] = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec
