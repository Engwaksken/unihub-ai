# WITU AI — HTTPS vhost for ai.witulibrary.org
# Target: /etc/apache2/sites-available/ai.witulibrary.org-le-ssl.conf
# Install with infra/witu/apply-apache.sh (backs up the old file, runs configtest, rolls back on failure).
# The port-80 vhost (ai.witulibrary.org.conf, certbot's HTTP->HTTPS redirect) is NOT changed.
#
# Routing (docs/adr/0002-witu-single-vps.md §Routing):
#   /v1/health            -> FastAPI GET /health   (NOT /health: that path is the CMS "Server & alerts" page)
#   /v1/*                 -> FastAPI 127.0.0.1:8000 (models, chat/completions) until gateway cut-over
#   everything else       -> Laravel CMS, /var/www/witu-ai/public, PHP 8.4 FPM pool "witu-cms"
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName ai.witulibrary.org
    DocumentRoot /var/www/witu-ai/public

    # ---- TLS (paths written by certbot; keep them identical to the backed-up file) ----
    SSLCertificateFile /etc/letsencrypt/live/ai.witulibrary.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/ai.witulibrary.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf

    # ---- Security headers ----
    Header always set Strict-Transport-Security "max-age=31536000"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always unset X-Powered-By
    ServerSignature Off

    # Request body cap for the CMS (forms, logo upload). /v1 has its own cap below.
    LimitRequestBody 8388608
    Timeout 75

    # ---- AI API -> legacy FastAPI gateway (localhost only) ----
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        /v1/health http://127.0.0.1:8000/health retry=0
    ProxyPassReverse /v1/health http://127.0.0.1:8000/health
    # timeout: 30 s queue wait + generation of up to 256 tokens at ~5 tok/s (~50 s) + margin
    ProxyPass        /v1/ http://127.0.0.1:8000/v1/ retry=0 timeout=120
    ProxyPassReverse /v1/ http://127.0.0.1:8000/v1/
    <Location /v1/>
        LimitRequestBody 65536
    </Location>

    # ---- Laravel ----
    <Directory /var/www/witu-ai/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require all granted

        RewriteEngine On
        RewriteCond %{HTTP:Authorization} .
        RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_URI} (.+)/$
        RewriteRule ^ %1 [L,R=301]
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/witu-cms.sock|fcgi://witu-cms"
    </FilesMatch>
    <Proxy "fcgi://witu-cms">
        ProxySet timeout=75
    </Proxy>

    # Nothing outside public/ is reachable; also refuse dotfiles inside it.
    <DirectoryMatch "/\.(?!well-known)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    # Long-cache the fingerprinted Vite assets.
    <Directory /var/www/witu-ai/public/build>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/witu-ai-error.log
    CustomLog ${APACHE_LOG_DIR}/witu-ai-access.log combined
</VirtualHost>
</IfModule>
