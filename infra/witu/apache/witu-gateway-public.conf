# WITU AI gateway v2, PUBLIC surface (phase C). Installed by install-gateway.sh to
# /etc/apache2/sites-available/witu-gateway-public.conf.
#
# Loopback only. The internet reaches it through the ai.witulibrary.org vhost:
#   https://ai.witulibrary.org/gw/v1/...  ->  http://127.0.0.1:8082/v1/...
# (models, chat/completions, jobs), with project keys from the CMS. FastAPI keeps /v1
# until the final cut-over (runbook, phase C).
Listen 127.0.0.1:8082

<VirtualHost 127.0.0.1:8082>
    ServerName witu-gateway-public.internal
    DocumentRoot /opt/witu-gateway/public

    # The gateway serves only its public routes here; /internal/* answers 404 (ADR D6).
    SetEnv GATEWAY_SURFACE public
    LimitRequestBody 131072
    Timeout 180

    <Directory /opt/witu-gateway/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require ip 127.0.0.1 ::1
        CGIPassAuth On
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/witu-gateway-public.sock|fcgi://witu-gateway-public"
    </FilesMatch>
    <Proxy "fcgi://witu-gateway-public">
        ProxySet timeout=180
    </Proxy>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/witu-gateway-public-error.log
    CustomLog ${APACHE_LOG_DIR}/witu-gateway-public-access.log combined
</VirtualHost>
