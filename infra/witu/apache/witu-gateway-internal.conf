# WITU AI gateway v2, management surface (phase B). Installed by install-gateway.sh to
# /etc/apache2/sites-available/witu-gateway-internal.conf.
#
# Loopback only: nothing outside the server can reach port 8081. The CMS calls
# http://127.0.0.1:8081/internal/v1 with its management token plus a signed actor assertion.
# The public /v1 API stays on FastAPI until the phase C cut-over (ADR 0002 W5).
Listen 127.0.0.1:8081

<VirtualHost 127.0.0.1:8081>
    ServerName witu-gateway.internal
    DocumentRoot /opt/witu-gateway/public

    # The gateway refuses every route unless this matches the route's surface (ADR D6).
    SetEnv GATEWAY_SURFACE internal
    LimitRequestBody 65536

    <Directory /opt/witu-gateway/public>
        Options -Indexes -MultiViews +FollowSymLinks
        AllowOverride None
        Require ip 127.0.0.1 ::1
        # Pass the Authorization (management token) header through to PHP-FPM.
        CGIPassAuth On
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteRule ^ index.php [L]
    </Directory>
    <FilesMatch "\.php$">
        SetHandler "proxy:unix:/run/php/witu-gateway.sock|fcgi://witu-gateway"
    </FilesMatch>
    <Proxy "fcgi://witu-gateway">
        ProxySet timeout=30
    </Proxy>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/witu-gateway-error.log
    CustomLog ${APACHE_LOG_DIR}/witu-gateway-access.log combined
</VirtualHost>
