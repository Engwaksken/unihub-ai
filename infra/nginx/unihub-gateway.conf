# Two vhosts, one PHP-FPM pool; the FastCGI param GATEWAY_SURFACE tells the app
# which routes this vhost may reach (ADR D6). Certificates via certbot.

limit_req_zone $binary_remote_addr zone=uh_public:10m rate=10r/s;

upstream unihub_gateway_fpm {
    server unix:/run/php/unihub-gateway.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name ai.kemmytech.com mgmt-ai.kemmytech.com;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}

# ---------- Public project API ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.kemmytech.com;

    ssl_certificate     /etc/letsencrypt/live/ai.kemmytech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.kemmytech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /opt/unihub-gateway/current/public;
    client_max_body_size 32k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    server_tokens off;

    # Management routes never exist on this host.
    location ^~ /internal/ { return 404; }

    location / {
        limit_req zone=uh_public burst=20 nodelay;
        limit_req_status 429;
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param GATEWAY_SURFACE public;
        fastcgi_read_timeout 20s;
        fastcgi_pass unihub_gateway_fpm;
    }

    location ~ \.php$ { return 404; }
    access_log /var/log/nginx/unihub-gateway-public.log;  # default format: no bodies
}

# ---------- Management API (CMS only) ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mgmt-ai.kemmytech.com;

    ssl_certificate     /etc/letsencrypt/live/mgmt-ai.kemmytech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mgmt-ai.kemmytech.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    # Only the cPanel CMS egress IP (preflight B-2). Replace before enabling.
    allow 203.0.113.10;   # TODO-PREFLIGHT: cPanel egress IP
    deny all;

    # Optional mTLS (Q-05):
    # ssl_client_certificate /etc/unihub-gateway/cms-client-ca.pem;
    # ssl_verify_client on;

    root /opt/unihub-gateway/current/public;
    client_max_body_size 64k;

    location /internal/v1/ {
        try_files $uri /index.php$is_args$args;
    }
    location / { return 404; }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param GATEWAY_SURFACE internal;
        fastcgi_read_timeout 30s;
        fastcgi_pass unihub_gateway_fpm;
    }
    access_log /var/log/nginx/unihub-gateway-mgmt.log;
}
